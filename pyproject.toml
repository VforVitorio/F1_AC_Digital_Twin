[project]
name = "F1_AC_DIGITAL_TWIN"
version = "0.1.0"
description = "A F1 digital twin trained through BL and RL for Asseto Corsa"
readme = "README.md"
requires-python = "~=3.11.0"
license = {text = "MIT"}
authors = [
    {name = "Víctor"},
    {name = "Santiago"}
]
keywords = [
    "F1",
    "AI",
    "Digital Twin",
    "RL"

]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Games/Entertainment :: Simulation",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",

    # Kafka - Real-time data streaming
    "confluent-kafka>=2.3.0",

    # InfluxDB - Time series database
    "influxdb-client>=1.38.0",

    # Utilities
    "python-dateutil>=2.8.2",

    # Environment Variables
    "python-dotenv>=1.0.0",

    # Jupyter & Visualization (existing)
    "matplotlib",
    "ipython",
    "ipykernel",
    "plotly",
    "nbformat",
    "ipywidgets"
]

[project.urls]
Homepage = "https://github.com/VforVitorio/F1_AC_Digital_Twin"
Repository = "https://github.com/VforVitorio/F1_AC_Digital_Twin"
"Víctor's LinkedIn" = "https://www.linkedin.com/in/victorvegasobral/"
"Santiago's LinkedIn" = "https://www.linkedin.com/in/santiagosoutoortega/"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"